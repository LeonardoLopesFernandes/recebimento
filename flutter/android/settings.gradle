pluginManagement {
    def flutterSdkPath = {
        def props = new Properties()
        def flutterSdkDir = System.getProperty("flutter.sdk")
        if (flutterSdkDir != null) {
            return flutterSdkDir
        }
        def localProps = new File(settings.rootDir, "local.properties")
        if (localProps.exists()) {
            localProps.withInputStream { props.load(it) }
            def sdkDir = props.getProperty("flutter.sdk")
            if (sdkDir != null) return sdkDir
        }
        return System.getenv("FLUTTER_ROOT")
    }()
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "7.3.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.10" apply false
}

include ":app"
