name: Build APK (arm64-v8a)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate CI keystore (release signing)
        run: |
          keytool -genkeypair -v \
            -keystore "${{ github.workspace }}/release-key.jks" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias androidkey \
            -storepass android -keypass android \
            -dname "CN=Recebimento"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build release APK (split arm64-v8a)
        run: ./gradlew assembleRelease -PmicrosoftClientSecret=$microsoftClientSecret
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androidkey
          KEY_PASSWORD: android
          microsoftClientSecret: ${{ secrets.MICROSOFT_CLIENT_SECRET }}

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: recebimento-arm64-v8a
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
