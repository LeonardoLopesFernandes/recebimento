name: Build Flutter APK (arm64-v8a)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'

      - name: Patch Flutter Gradle plugin onVariants ABI bug
        run: |
          FILE="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterPluginUtils.kt"
          if [ -f "$FILE" ] && grep -q "androidComponents.onVariants {" "$FILE"; then
            sed -i 's/androidComponents.onVariants {/androidComponents.onVariants(androidComponents.selector().all()) {/' "$FILE"
          fi

      - name: Generate CI keystore (release signing)
        run: |
          keytool -genkeypair -v \
            -keystore "${{ github.workspace }}/release-key.jks" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias androidkey \
            -storepass android -keypass android \
            -dname "CN=Recebimento"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK (split arm64-v8a)
        run: flutter build apk --split-per-abi --target-platform android-arm64 --dart-define=MICROSOFT_CLIENT_SECRET=$microsoftClientSecret
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androidkey
          KEY_PASSWORD: android
          microsoftClientSecret: ${{ secrets.MICROSOFT_CLIENT_SECRET }}

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: recebimento-flutter-arm64-v8a
          path: ${{ github.workspace }}/flutter/build/app/outputs/flutter-apk/*arm64-v8a*.apk
