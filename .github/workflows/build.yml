name: Build Flutter APK (arm64-v8a)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          if [ -d "$SDK/cmdline-tools/latest" ]; then
            echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          else
            echo "$SDK/cmdline-tools/16.0/bin" >> $GITHUB_PATH
          fi
          echo "$SDK/platform-tools" >> $GITHUB_PATH
          if [ -d "$SDK/cmdline-tools/latest" ]; then TOOLS="$SDK/cmdline-tools/latest/bin"; else TOOLS="$SDK/cmdline-tools/16.0/bin"; fi
          ls "$SDK/cmdline-tools/"
          "$TOOLS/sdkmanager" --version

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'

      - name: Patch Flutter Gradle plugin onVariants ABI bug
        run: |
          FILE="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterPluginUtils.kt"
          if [ -f "$FILE" ] && grep -q "androidComponents.onVariants {" "$FILE"; then
            sed -i 's/androidComponents.onVariants {/androidComponents.onVariants(androidComponents.selector().all()) {/' "$FILE"
          fi

      - name: Decode release keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release-key.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK (split arm64-v8a, updatable)
        run: flutter build apk --split-per-abi --target-platform android-arm64 --build-number=$BUILD_NUMBER --build-name="1.0.$BUILD_NUMBER" --dart-define=MICROSOFT_CLIENT_SECRET=$microsoftClientSecret
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          microsoftClientSecret: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/*arm64-v8a*.apk build/app/outputs/flutter-apk/recebimento_flutter.apk && ls -la build/app/outputs/flutter-apk/recebimento_flutter.apk

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: recebimento_flutter-apk
          path: ${{ github.workspace }}/flutter/build/app/outputs/flutter-apk/recebimento_flutter.apk
