name: Build Flutter APK (arm64-v8a)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Decode release keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release-key.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Shorebird release (APK arm64, OTA pronto)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          microsoftClientSecret: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          shorebird doctor
          shorebird release android \
            --artifact=apk \
            --target-platform android-arm64 \
            --flutter-version=3.38.5 \
            --build-number=$BUILD_NUMBER \
            --build-name=1.0.0 \
            -- --dart-define=MICROSOFT_CLIENT_SECRET=$microsoftClientSecret --no-tree-shake-icons

      - name: Publicar changelog nas notes do Shorebird
        if: success()
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: dart run scripts/update_shorebird_notes.dart

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk recebimento-arm64-v8a-release.apk

      - name: Cleanup keystore
        if: always()
        run: rm -f "${{ github.workspace }}/release-key.jks"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: Recebimento (${{ github.ref_type == 'tag' && github.ref_name || 'latest' }})
          body: |
            Build automático a partir do commit `${{ github.sha }}`.
            APK Flutter **arm64-v8a** (release), split-per-abi.
            Instale sobre a versão anterior para atualizar (versionCode crescente).
          files: flutter/recebimento-arm64-v8a-release.apk
          overwrite: true
          make_latest: true